<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuDespensa — Registro y Usuarios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <header class="cabecera o-contenedor">
    <a href="index.html" class="cabecera__marca">TuDespensa</a>
    <nav class="cabecera__nav">
      <ul class="cabecera__lista">
        <li class="cabecera__item">
          <a href="index.html" class="cabecera__enlace">Inicio</a>
        </li>
        <li class="cabecera__item">
          <a href="inventario.html" class="cabecera__enlace">Mi Inventario</a>
        </li>
        <li class="cabecera__item">
          <a href="recetas.html" class="cabecera__enlace">Recetas Sugeridas</a>
        </li>
        <li class="cabecera__item">
          <a href="contacto.html" class="cabecera__enlace">Contacto</a>
        </li>
      </ul>
    </nav>
    <a href="acceso.html" class="cabecera__accion boton boton--secundario boton--mediano">Iniciar sesión</a>
  </header>

  <main class="o-contenedor">
    <section class="autenticacion">
      <header class="autenticacion__cabecera">
        <a href="index.html" class="autenticacion__volver" aria-label="Volver al inicio">←</a>
        <h1 class="autenticacion__titulo">Registro de cuenta</h1>
      </header>

      <article class="tarjeta-auth">
        <nav class="pestanas" aria-label="Modo de autenticación">
          <a href="acceso.html" class="pestanas__enlace">Iniciar sesión</a>
          <a href="registro.html" class="pestanas__enlace pestanas__enlace--activo" aria-current="page">Registrarse</a>
        </nav>

        <form id="formulario-registro" class="formulario-auth" action="#" method="post" novalidate>
          <input type="hidden" id="registro-id" name="id" value="">

          <p class="campo">
            <label for="registro-usuario" class="campo__etiqueta">Nombre de usuario</label>
            <input type="text" id="registro-usuario" name="usuario" class="campo__entrada" placeholder="maria_cocina" minlength="3" maxlength="20" required aria-describedby="error-registro-usuario">
            <span id="error-registro-usuario" class="campo__error" role="alert"></span>
          </p>

          <p class="campo">
            <label for="registro-email" class="campo__etiqueta">Correo electrónico</label>
            <input type="email" id="registro-email" name="email" class="campo__entrada" placeholder="ejemplo@correo.com" required aria-describedby="error-registro-email">
            <span id="error-registro-email" class="campo__error" role="alert"></span>
          </p>

          <p class="campo">
            <label for="registro-fecha" class="campo__etiqueta">Fecha de nacimiento</label>
            <input type="date" id="registro-fecha" name="fechaNacimiento" class="campo__entrada" min="1920-01-01" max="2010-11-24" required aria-describedby="error-registro-fecha">
            <span id="error-registro-fecha" class="campo__error" role="alert"></span>
          </p>

          <p class="campo">
            <label for="registro-password" class="campo__etiqueta">Contraseña</label>
            <input type="password" id="registro-password" name="password" class="campo__entrada" placeholder="Mín. 8 caracteres, 1 mayúscula y 1 número" minlength="8" required aria-describedby="error-registro-password">
            <span id="error-registro-password" class="campo__error" role="alert"></span>
          </p>

          <p class="campo">
            <label for="registro-confirmar" class="campo__etiqueta">Repetir contraseña</label>
            <input type="password" id="registro-confirmar" name="confirmar_password" class="campo__entrada" placeholder="••••••••" minlength="8" required aria-describedby="error-registro-confirmar">
            <span id="error-registro-confirmar" class="campo__error" role="alert"></span>
          </p>

          <p class="campo campo--casilla">
            <label for="registro-condiciones" class="campo__etiqueta-casilla">
              <input type="checkbox" id="registro-condiciones" name="condiciones" class="campo__casilla" required aria-describedby="error-registro-condiciones">
              Acepto las condiciones de uso y política de privacidad de TuDespensa
            </label>
            <span id="error-registro-condiciones" class="campo__error" role="alert"></span>
          </p>

          <footer class="formulario-auth__acciones">
            <button type="submit" id="btn-submit-registro" class="formulario-auth__boton boton boton--oscuro boton--grande">Crear cuenta</button>
            <button type="button" id="btn-cancelar-edicion" class="boton boton--secundario boton--grande" hidden>Cancelar edición</button>
          </footer>
        </form>
      </article>
    </section>

    <section class="seccion-listado">
      <header class="seccion-listado__cabecera">
        <h2 class="seccion-listado__titulo">Usuarios</h2>
        <p id="contador-usuarios" class="seccion-listado__contador">0 usuarios</p>
      </header>

      <ul id="lista-usuarios" class="o-cuadricula"></ul>
    </section>
  </main>

  <dialog id="dialogo-confirmacion" class="dialogo-confirmacion">
    <form method="dialog" class="dialogo-confirmacion__contenido">
      <h2 class="dialogo-confirmacion__titulo">Confirmar eliminación</h2>
      <p id="dialogo-confirmacion-texto" class="dialogo-confirmacion__texto">¿Seguro que deseas eliminar este registro?</p>
      <footer class="dialogo-confirmacion__acciones">
        <button type="button" id="btn-dialogo-cancelar" class="boton boton--secundario boton--mediano">Cancelar</button>
        <button type="button" id="btn-dialogo-aceptar" class="boton boton--oscuro boton--mediano">Eliminar</button>
      </footer>
    </form>
  </dialog>

  <script src="./js/almacen.js"></script>
  <script src="./js/validacion.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/main.js"></script>

</body>
</html>
