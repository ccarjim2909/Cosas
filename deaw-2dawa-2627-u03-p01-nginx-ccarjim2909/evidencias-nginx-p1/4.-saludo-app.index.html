<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saludo en Nginx</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 50px; }
    input, button { padding: 8px; font-size: 16px; }
    #resultado { margin-top: 20px; font-size: 20px; font-weight: bold; color: #2c3e50; }
  </style>
</head>
<body>
  <h2>Introduce tu nombre</h2>
  <input type="text" id="nombreInput" placeholder="Ej. Pedro">
  <button onclick="saludar()">Aceptar</button>
  <div id="resultado"></div>

  <script>
    function saludar() {
      const nombre = document.getElementById('nombreInput').value.trim();
      const contenedor = document.getElementById('resultado');
      if (nombre !== "") {
        contenedor.textContent = "Hola " + nombre + "!!";
      } else {
        contenedor.textContent = "Por favor, escribe un nombre.";
      }
    }
  </script>
</body>
</html>
